<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login — luizFabiano</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0A1628;color:#E2F0FF;min-height:100vh;display:flex;align-items:center;justify-content:center}
.box{width:400px;background:#1A3050;border:1px solid rgba(0,212,255,.15);border-radius:16px;padding:36px;box-shadow:0 8px 40px rgba(0,0,0,.5)}
.logo{text-align:center;margin-bottom:28px}
.logo-icon{width:58px;height:58px;background:linear-gradient(135deg,#00D4FF,#B666FF);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 12px}
.logo-name{font-size:22px;font-weight:700;letter-spacing:-.3px}
.logo-name span{color:#00D4FF}
.logo-sub{font-size:12px;color:#7FA8CC;margin-top:3px}
.fg{margin-bottom:14px}
.label{display:block;font-size:12px;color:#7FA8CC;margin-bottom:5px;font-weight:500}
.input{width:100%;background:#0F1F3D;border:1px solid rgba(0,212,255,.15);border-radius:8px;color:#E2F0FF;font-family:inherit;font-size:14px;padding:10px 13px;outline:none;transition:.15s}
.input:focus{border-color:#00D4FF;box-shadow:0 0 0 3px rgba(0,212,255,.12)}
.btn{width:100%;padding:11px;background:#00D4FF;color:#0A1628;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s;letter-spacing:.3px}
.btn:hover{background:#00bfe6;box-shadow:0 0 20px rgba(0,212,255,.3)}
.alert{padding:10px 13px;border-radius:8px;font-size:13px;margin-bottom:14px;display:flex;align-items:center;gap:7px}
.alert-error{background:rgba(255,76,106,.12);color:#FF4C6A;border:1px solid rgba(255,76,106,.25)}
.hint{margin-top:20px;padding:12px;background:rgba(0,212,255,.06);border:1px solid rgba(0,212,255,.12);border-radius:8px;font-size:12px;color:#7FA8CC;text-align:center}
</style>
</head>
<body>
<div class="box">
  <div class="logo">
    <div class="logo-icon">💻</div>
    <div class="logo-name">luiz<span>Fabiano</span></div>
    <div class="logo-sub">Sistema Inteligente de Controle de Notebooks</div>
  </div>
  {% with msgs=get_flashed_messages(with_categories=true) %}
    {% for cat,msg in msgs %}
    <div class="alert alert-{{ cat }}">❌ {{ msg }}</div>
    {% endfor %}
  {% endwith %}
  <form method="POST">
    <div class="fg"><label class="label">Email</label><input class="input" type="email" name="email" placeholder="admin@luizfabiano.com" autofocus required></div>
    <div class="fg"><label class="label">Senha</label><input class="input" type="password" name="senha" placeholder="••••••••" required></div>
    <button class="btn" type="submit">🔐 Entrar no Sistema</button>
  </form>
  <div class="hint">💡 Padrão: admin@luizfabiano.com / admin123456</div>
</div>
</body>
</html>
